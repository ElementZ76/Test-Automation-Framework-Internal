name: SauceDemo Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:       # Allows manual trigger from GitHub UI

jobs:
  test:
    name: Run Selenium Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java 11 (matches your pom.xml compiler target)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven          # Caches ~/.m2 between runs — faster builds

      # 3. Chrome is pre-installed on ubuntu-latest runners.
      # This step ensures the version matches ChromeDriver via Selenium Manager.
      - name: Verify Chrome Installation
        run: google-chrome --version

      # 4. Run the full test suite
      - name: Run Tests
        run: mvn clean test --no-transfer-progress
        continue-on-error: true   # Don't stop pipeline on test failure
                                  # so we still upload reports below

      # 5. Upload the raw Allure results as an artifact
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()              # Run even if tests failed
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 7

      # 6. Upload Cucumber HTML report as backup
      - name: Upload Cucumber Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: target/cucumber-reports/
          retention-days: 7

      # 7. Upload logs
      - name: Upload Test Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-logs
          path: logs/
          retention-days: 7

  publish-report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: test                  # Only runs after the test job finishes
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Downloads the allure-results uploaded in the test job
      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/

      # Generates and publishes the Allure HTML report to GitHub Pages
      - name: Publish Allure Report to GitHub Pages
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history

      - name: Deploy Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history