name: Multi-App E-Commerce Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-publish:
    name: Run Tests & Publish Report
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run SauceDemo Tests
        run: mvn clean test -DappName=saucedemo -Dbrowser=chrome -DexecutionMode=local --no-transfer-progress
        continue-on-error: true

      - name: Run Flipkart Tests
        run: mvn clean test -DappName=flipkart -Dbrowser=chrome -DexecutionMode=local --no-transfer-progress
        continue-on-error: true
        
      - name: Debug - Show test output
        if: always()
        run: |
            echo "=== Does target exist? ==="
            ls -la target/ || echo "NO TARGET FOLDER"
            echo "=== Allure results ==="
            ls -la target/allure-results/ || echo "ALLURE RESULTS EMPTY"
            echo "=== Surefire reports ==="
            ls -la target/surefire-reports/ || echo "NO SUREFIRE REPORTS"
            echo "=== Maven test log ==="
            find . -name "*.txt" -path "*/surefire-reports/*" | head -5
      # DEBUG: Show what was actually generated after tests run
      - name: Debug - List target directory
        if: always()
        run: |
          echo "=== target/ contents ==="
          ls -la target/ || echo "target/ does not exist"
          echo "=== allure-results contents ==="
          ls -la target/allure-results/ || echo "target/allure-results is empty or missing"
          echo "=== cucumber-reports ==="
          ls -la target/cucumber-reports/ || echo "No cucumber reports"

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 7

      - name: Upload Cucumber Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: target/cucumber-reports/
          retention-days: 7

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-logs
          path: target/reports/logs/
          retention-days: 7

      - name: Publish Allure Report to GitHub Pages
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: target/allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history