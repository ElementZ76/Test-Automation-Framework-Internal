# Application
url = https://www.saucedemo.com/
appName = sauceDemo

# Browser
browser = edge

# Timeouts
implicitWait = 10

# Parallel execution
threads = 3

# Execution mode: local or grid
executionMode = local
gridUrl = http://localhost:4444/

# Browser args (passed to DriverFactory)
passwordBubble = --disable-save-password-bubble
headless = --headless
nosandbox = --no-sandbox
shmUsage = --disable-dev-shm-usage
windowSize = --window-size=1920,1080