# Application
url = https://www.saucedemo.com/
# Optional: set to load a matching {appName}.properties file that overrides this config.
# Example: -DappName=hrm loads src/test/resources/hrm.properties
# appName =

# Browser
browser = chrome

# Timeouts
implicitWait = 10

# Parallel execution
threads = 3

# Execution mode: local or grid
executionMode = local
gridUrl = http://localhost:4444/

# Browser args (passed to DriverFactory)
passwordBubble = --disable-save-password-bubble
headless = --headless
nosandbox = --no-sandbox
shmUsage = --disable-dev-shm-usage
windowSize = --window-size=1920,1080